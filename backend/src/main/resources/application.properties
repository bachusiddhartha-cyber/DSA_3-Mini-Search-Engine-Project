spring.application.name=mini-search-engine
server.port=8080

# Spring Boot 4 MongoDB Configuration
spring.mongodb.uri=mongodb://localhost:27017/mini_search_engine
spring.mongodb.database=mini_search_engine
spring.data.mongodb.uri=mongodb://localhost:27017/mini_search_engine
spring.data.mongodb.database=mini_search_engine

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
